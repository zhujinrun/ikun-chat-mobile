apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import com.android.build.OutputFile
import groovy.json.JsonSlurper

react {
  /* Folders / bundling / hermes — defaults are fine */
}

def enableSeparateBuildPerCPUArchitecture = true
def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def getNpmPackageJson() {
  def inputFile = new File("../package.json")
  def packageJson = new JsonSlurper().parseText(inputFile.text)
  return packageJson
}

def npmPackageJson = getNpmPackageJson()
def verCode = npmPackageJson["versionCode"]
def verName = npmPackageJson["version"]
def applicationName = npmPackageJson["name"]

android {
  ndkVersion rootProject.ext.ndkVersion

  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  namespace "com.ikunshare.chat.mobile"
  defaultConfig {
    applicationId "com.ikunshare.chat.mobile"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode verCode
    versionName verName
  }

  splits {
    abi {
      reset()
      enable enableSeparateBuildPerCPUArchitecture
      universalApk true
      include(*reactNativeArchitectures())
    }
  }
  signingConfigs {
    release {
      if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
        storeFile file(MYAPP_UPLOAD_STORE_FILE)
        storePassword MYAPP_UPLOAD_STORE_PASSWORD
        keyAlias MYAPP_UPLOAD_KEY_ALIAS
        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
      } else {
        def keystorePropertiesFile = rootProject.file("keystore.properties")
        if (keystorePropertiesFile.exists()) {
          def keystoreProperties = new Properties()
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          storeFile file(keystoreProperties['storeFile'])
          storePassword keystoreProperties['storePassword']
          keyAlias keystoreProperties['keyAlias']
          keyPassword keystoreProperties['keyPassword']
        }
      }
    }
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled enableProguardInReleaseBuilds
      // 移除未使用资源，进一步缩小 release 体积
      shrinkResources enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
      if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE') || rootProject.file("keystore.properties").exists()) {
        signingConfig signingConfigs.release
      } else {
        // 无正式签名时回退 debug 签名，便于本地验证体积
        signingConfig signingConfigs.debug
      }
    }
  }

  applicationVariants.all { variant ->
    variant.outputs.each { output ->
      def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
      def abi = output.getFilter(OutputFile.ABI)
      if (abi == null) {
        output.outputFileName =
          "${applicationName}-v${defaultConfig.versionName}-universal.apk"
      } else {
        output.versionCodeOverride =
          defaultConfig.versionCode * 1000 + versionCodes.get(abi)
        output.outputFileName =
          "${applicationName}-v${defaultConfig.versionName}-${abi}.apk"
      }
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  // Flipper 仅 debug：release 使用 src/release 下的空实现，避免打入 libflipper 等调试库
  debugImplementation("com.facebook.react:flipper-integration")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
