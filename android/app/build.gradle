apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import com.android.build.OutputFile
import groovy.json.JsonSlurper

react {
  /* Folders / bundling / hermes — defaults are fine */
}

def enableSeparateBuildPerCPUArchitecture = true
def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def getNpmPackageJson() {
  def inputFile = new File("../package.json")
  def packageJson = new JsonSlurper().parseText(inputFile.text)
  return packageJson
}

def npmPackageJson = getNpmPackageJson()
def verCode = npmPackageJson["versionCode"]
def verName = npmPackageJson["version"]
def applicationName = npmPackageJson["name"]
def hasText = { value -> value != null && value.toString().trim() }
def resolveLocalStoreFile = { rawPath ->
  def path = rawPath.toString().trim()
  if (path == "~") return new File(System.getProperty("user.home"))
  if (path.startsWith("~/")) return new File(System.getProperty("user.home"), path.substring(2))

  def storeFile = new File(path)
  return storeFile.isAbsolute() ? storeFile : rootProject.file(path)
}
def releaseSigningConfigured = false
def releaseSigningError =
  "Release 打包未配置签名：本地使用 android/keystore.properties，CI 使用 GitHub Secrets 注入的 KEYSTORE_* 环境变量"

def configureReleaseSigning = { signing ->
  def ciSigning = [
    storeFile: System.getenv('KEYSTORE_FILE')?.trim(),
    storePassword: System.getenv('KEYSTORE_STORE_PASSWORD'),
    keyAlias: System.getenv('KEYSTORE_ALIAS'),
    keyPassword: System.getenv('KEYSTORE_KEY_PASSWORD'),
  ]
  def hasCiSigning = ciSigning.values().any { hasText(it) }

  if (hasCiSigning) {
    def missingCiKeys = ciSigning.findAll { key, value -> !hasText(value) }.keySet()
    if (missingCiKeys.isEmpty()) {
      def ciStoreFile = file(ciSigning.storeFile)
      if (ciStoreFile.isFile()) {
        // GitHub Actions release: secrets are exposed as KEYSTORE_* environment variables.
        signing.storeFile = ciStoreFile
        signing.storePassword = ciSigning.storePassword
        signing.keyAlias = ciSigning.keyAlias
        signing.keyPassword = ciSigning.keyPassword
        releaseSigningConfigured = true
      } else {
        releaseSigningError = "CI 签名文件不存在: ${ciStoreFile.absolutePath}"
      }
    } else {
      releaseSigningError = "CI 签名环境变量不完整，缺少: ${missingCiKeys.join(', ')}"
    }
  } else {
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
      def keystoreProperties = new Properties()
      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
      def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
      def missingLocalKeys = requiredKeys.findAll { key -> !hasText(keystoreProperties[key]) }

      if (missingLocalKeys.isEmpty()) {
        def localStoreFile = resolveLocalStoreFile(keystoreProperties['storeFile'])
        if (!localStoreFile.isFile()) {
          releaseSigningError = "本地签名文件不存在: ${localStoreFile.absolutePath}"
        } else {
          // Local release: android/keystore.properties points to the private keystore.
          signing.storeFile = localStoreFile
          signing.storePassword = keystoreProperties['storePassword'].toString()
          signing.keyAlias = keystoreProperties['keyAlias'].toString()
          signing.keyPassword = keystoreProperties['keyPassword'].toString()
          releaseSigningConfigured = true
        }
      } else {
        releaseSigningError = "android/keystore.properties 缺少: ${missingLocalKeys.join(', ')}"
      }
    }
  }
}

android {
  ndkVersion rootProject.ext.ndkVersion

  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  namespace "com.ikunshare.chat.mobile"
  defaultConfig {
    applicationId "com.ikunshare.chat.mobile"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode verCode
    versionName verName
  }

  splits {
    abi {
      reset()
      enable enableSeparateBuildPerCPUArchitecture
      universalApk true
      include(*reactNativeArchitectures())
    }
  }
  signingConfigs {
    // Development debug: use the committed Android debug keystore.
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }

    release {
      configureReleaseSigning(delegate)
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled enableProguardInReleaseBuilds
      shrinkResources enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
  }

  applicationVariants.all { variant ->
    variant.outputs.each { output ->
      def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
      def abi = output.getFilter(OutputFile.ABI)
      if (abi == null) {
        output.outputFileName =
          "${applicationName}-v${defaultConfig.versionName}-universal.apk"
      } else {
        output.versionCodeOverride =
          defaultConfig.versionCode * 1000 + versionCodes.get(abi)
        output.outputFileName =
          "${applicationName}-v${defaultConfig.versionName}-${abi}.apk"
      }
    }
  }
}

gradle.taskGraph.whenReady { taskGraph ->
  def hasAppReleaseTask = taskGraph.allTasks.any { task ->
    task.project == project && task.name.toLowerCase().contains("release")
  }
  if (hasAppReleaseTask && !releaseSigningConfigured) {
    throw new GradleException(releaseSigningError)
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  // Flipper 仅 debug：release 使用 src/release 下的空实现，避免打入 libflipper 等调试库
  debugImplementation("com.facebook.react:flipper-integration")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
