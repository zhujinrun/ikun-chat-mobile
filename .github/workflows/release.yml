name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN 默认只读会导致打 tag / 创建 Release 403
permissions:
  contents: write

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          # 允许后续 job / action 推送 tag
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Decode release keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "缺少 Secrets: KEYSTORE_STORE_FILE_BASE64 / KEYSTORE_STORE_FILE"
            exit 1
          fi
          # 兼容单行/多行 base64
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "app/${KEYSTORE_FILE}"
          if [ ! -s "app/${KEYSTORE_FILE}" ]; then
            echo "keystore 解码结果为空，请检查 KEYSTORE_STORE_FILE_BASE64"
            exit 1
          fi
          ls -la "app/${KEYSTORE_FILE}"

      - name: Build Packages
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_FILE:-}" ] || [ -z "${KEYSTORE_ALIAS:-}" ] || [ -z "${KEYSTORE_STORE_PASSWORD:-}" ] || [ -z "${KEYSTORE_KEY_PASSWORD:-}" ]; then
            echo "缺少签名 Secrets: KEYSTORE_STORE_FILE / KEYSTORE_KEY_ALIAS / KEYSTORE_PASSWORD / KEYSTORE_KEY_PASSWORD"
            exit 1
          fi
          trap 'rm -f "app/${KEYSTORE_FILE}"' EXIT
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace assembleRelease

      - name: Upload JVM crash log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-jvm-crash-log
          path: android/hs_err_pid*.log
          if-no-files-found: ignore

      - name: Get package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Create git tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: 'v'

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: [Android]
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate file MD5
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          md5sum *.apk >> ../publish/changeLog.md
          echo -e '```\n' >> ../publish/changeLog.md

      - name: Get package version
        run: node -p -e '`PACKAGE_VERSION=${require("./package.json").version}`' >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: false
          draft: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          files: |
            artifacts/ikun-chat-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
            artifacts/ikun-chat-mobile-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk
            artifacts/ikun-chat-mobile-v${{ env.PACKAGE_VERSION }}-x86_64.apk
            artifacts/ikun-chat-mobile-v${{ env.PACKAGE_VERSION }}-x86.apk
            artifacts/ikun-chat-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
