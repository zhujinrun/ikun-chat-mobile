name: Setup
description: Setup Env

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        # 使用 Node 22，避免 Actions 对 Node 20 的弃用警告
        node-version: '22'
        cache: npm

    - name: Setup Java Env
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Install dependencies
      shell: bash
      run: npm ci
